name: Emulator smoke tests

# Runs only when the app changes (pull requests touching app/ or the build files) and on version tags.
# The tests live in app/src/androidTest; see docs/testing.md.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-emulator.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4.2.1
      - name: Make the wrapper executable
        run: chmod +x gradlew
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented smoke tests (API 34, x86_64, animations off)
        # Pinned to a commit: this is the v2.38.0 tag of ReactiveCircus/android-emulator-runner.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: androidTest-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
